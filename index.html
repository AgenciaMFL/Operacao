<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0D1220">
  <title>Proposta Comercial</title>
  <link rel="icon" href="assets/img/mfl-sales-icone.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@400;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/video/capa-fundo.mp4" as="video" type="video/mp4">
  <link rel="stylesheet" href="assets/css/proposta.css">
</head>
<body class="carregando">
  <div id="estado" class="estado" role="status">
    <div class="estado-spinner" aria-hidden="true"></div>
    <p>Carregando proposta…</p>
  </div>

  <section id="capa" class="capa" hidden></section>

  <div id="proposta" class="proposta" hidden>
    <div class="progresso-leitura" aria-hidden="true"><span id="progresso"></span></div>
    <main id="conteudo"></main>
    <footer class="rodape" id="rodape"></footer>
    <div class="barra-cta" id="barra-cta"></div>
  </div>

  <script src="assets/js/proposta.js"></script>
</body>
</html>
