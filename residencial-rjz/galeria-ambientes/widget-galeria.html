<!--
  Galeria "Ambientes projetados para o bem-estar" — Residencial Senior RJZ
  Substitui o carrossel vertical automático (.vertical-carousel-solo).

  COMO USAR NO ELEMENTOR:
  1. Página "Residencial RJZ" > widget HTML (ID 5f882f8, dentro do container 8ed94eb).
  2. Apague TODO o conteúdo do widget e cole este arquivo inteiro.
  3. Avançado > CSS personalizado do widget: apague o CSS antigo do ".vertical-carousel-solo"
     (a animação scrollVertical), senão ele continua sendo carregado à toa.
  4. Para trocar/adicionar fotos, edite só a lista de <a class="rjz-gal__thumb"> abaixo
     (href = foto grande, src = miniatura). Contador, setas e lightbox se ajustam sozinhos.
-->
<div class="rjz-gal" data-rjz-gal data-autoplay="5000">
  <div class="rjz-gal__stage">
    <button type="button" class="rjz-gal__main" aria-label="Ampliar foto">
      <img class="rjz-gal__main-img" src="https://residencialseniorrjz.com.br/wp-content/uploads/2026/11/residencial-carrossel-01.webp" alt="Ambiente do Residencial Senior RJZ — foto 1" width="1600" height="1067" fetchpriority="high">
      <span class="rjz-gal__zoom" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Ampliar
      </span>
    </button>
    <button type="button" class="rjz-gal__nav rjz-gal__nav--prev" aria-label="Foto anterior">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="rjz-gal__nav rjz-gal__nav--next" aria-label="Próxima foto">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="rjz-gal__meta">
      <button type="button" class="rjz-gal__play" aria-label="Pausar apresentação" aria-pressed="false">
        <svg class="rjz-gal__ico-pause" viewBox="0 0 24 24" width="14" height="14"><path d="M8 5v14M16 5v14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        <svg class="rjz-gal__ico-play" viewBox="0 0 24 24" width="14" height="14"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>
      </button>
      <span class="rjz-gal__count" aria-live="off">1 / 12</span>
    </div>
    <span class="rjz-gal__progress" aria-hidden="true"><span class="rjz-gal__progress-bar"></span></span>
  </div>

  <div class="rjz-gal__thumbs" role="list">
    <a class="rjz-gal__thumb" role="listitem" href="https://residencialseniorrjz.com.br/wp-content/uploads/2026/11/residencial-carrossel-01.webp"><img src="https://residencialseniorrjz.com.br/wp-content/uploads/2026/11/residencial-carrossel-01.webp" alt="Ambiente do Residencial Senior RJZ — foto 1" loading="lazy" width="160" height="107"></a>
    <a class="rjz-gal__thumb" role="listitem" href="https://residencialseniorrjz.com.br/wp-content/uploads/2026/11/residencial-carrossel-02.webp"><img src="https://residencialseniorrjz.com.br/wp-content/uploads/2026/11/residencial-carrossel-02.webp" alt="Ambiente do Residencial Senior RJZ — foto 2" loading="lazy" width="160" height="107"></a>
    <a class="rjz-gal__thumb" role="listitem" href="https://residencialseniorrjz.com.br/wp-content/uploads/2026/11/residencial-carrossel-03.webp"><img src="https://residencialseniorrjz.com.br/wp-content/uploads/2026/11/residencial-carrossel-03.webp" alt="Ambiente do Residencial Senior RJZ — foto 3" loading="lazy" width="160" height="107"></a>
    <a class="rjz-gal__thumb" role="listitem" href="https://residencialseniorrjz.com.br/wp-content/uploads/2026/11/residencial-carrossel-04.webp"><img src="https://residencialseniorrjz.com.br/wp-content/uploads/2026/11/residencial-carrossel-04.webp" alt="Ambiente do Residencial Senior RJZ — foto 4" loading="lazy" width="160" height="107"></a>

  <dialog class="rjz-gal__lb" aria-label="Galeria de fotos ampliada">
    <figure class="rjz-gal__lb-figure">
      <img class="rjz-gal__lb-img" src="" alt="">
    </figure>
    <span class="rjz-gal__lb-count" aria-live="polite"></span>
    <button type="button" class="rjz-gal__lb-btn rjz-gal__lb-close" aria-label="Fechar">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="rjz-gal__lb-btn rjz-gal__lb-prev" aria-label="Foto anterior">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="rjz-gal__lb-btn rjz-gal__lb-next" aria-label="Próxima foto">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </dialog>
</div>

<style>
.rjz-gal{
  --rjz-radius:32px;
  --rjz-gap:12px;
  --rjz-accent:#ffffff;
  --rjz-btn-bg:rgba(255,255,255,.92);
  --rjz-btn-fg:#3f4a2b;
  width:100%;
  max-width:640px;
  margin:48px auto;
  display:flex;
  flex-direction:column;
  gap:var(--rjz-gap);
  font-family:inherit;
}
.rjz-gal button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* ---------- Foto principal ---------- */
.rjz-gal__stage{position:relative;border-radius:var(--rjz-radius);overflow:hidden;background:rgba(0,0,0,.08);aspect-ratio:3/2}
.rjz-gal__main{all:unset;display:block;width:100%;height:100%;cursor:zoom-in}
.rjz-gal__main:focus-visible{outline:3px solid var(--rjz-accent);outline-offset:-6px;border-radius:var(--rjz-radius)}
.rjz-gal__main-img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .25s ease,transform .5s ease}
.rjz-gal__main:hover .rjz-gal__main-img{transform:scale(1.025)}
.rjz-gal__main-img.is-fading{opacity:0}

.rjz-gal__zoom{
  position:absolute;right:16px;bottom:16px;display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;background:var(--rjz-btn-bg);color:var(--rjz-btn-fg);
  font-size:14px;font-weight:500;line-height:1;box-shadow:0 2px 10px rgba(0,0,0,.15);pointer-events:none
}
.rjz-gal__meta{
  position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:4px;padding:4px 12px 4px 4px;
  border-radius:999px;background:rgba(0,0,0,.55);color:#fff
}
.rjz-gal__count{font-size:14px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.rjz-gal__play{
  all:unset;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.18);color:#fff;transition:background .15s ease
}
.rjz-gal__play:hover{background:rgba(255,255,255,.32)}
.rjz-gal__play:focus-visible{outline:2px solid #fff;outline-offset:2px}
.rjz-gal__ico-play{display:none}
.rjz-gal.is-paused-user .rjz-gal__ico-play{display:block}
.rjz-gal.is-paused-user .rjz-gal__ico-pause{display:none}
.rjz-gal__progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25);pointer-events:none}
.rjz-gal__progress-bar{display:block;height:100%;width:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
.rjz-gal__nav{
  all:unset;position:absolute;top:50%;transform:translateY(-50%);
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:var(--rjz-btn-bg);color:var(--rjz-btn-fg);box-shadow:0 2px 10px rgba(0,0,0,.18);
  cursor:pointer;transition:transform .15s ease,background .15s ease
}
.rjz-gal__nav:hover{background:#fff;transform:translateY(-50%) scale(1.07)}
.rjz-gal__nav:focus-visible{outline:3px solid var(--rjz-accent);outline-offset:2px}
.rjz-gal__nav--prev{left:14px}
.rjz-gal__nav--next{right:14px}

/* ---------- Miniaturas ---------- */
.rjz-gal__thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.rjz-gal__thumb{
  display:block;position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1/1;
  outline:3px solid transparent;outline-offset:-3px;transition:outline-color .2s ease,opacity .2s ease;opacity:.72
}
.rjz-gal__thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .3s ease}
.rjz-gal__thumb:hover{opacity:1}
.rjz-gal__thumb:hover img{transform:scale(1.06)}
.rjz-gal__thumb[aria-current="true"]{opacity:1;outline-color:var(--rjz-accent)}
.rjz-gal__thumb:focus-visible{opacity:1;outline-color:var(--rjz-accent);outline-offset:2px}

/* ---------- Lightbox ---------- */
.rjz-gal__lb{
  border:0;padding:0;margin:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;
  background:rgba(18,20,14,.94);color:#fff;overflow:hidden
}
.rjz-gal__lb::backdrop{background:rgba(18,20,14,.94)}
.rjz-gal__lb[open]{display:grid;place-items:center;animation:rjzFade .2s ease}
@keyframes rjzFade{from{opacity:0}to{opacity:1}}
.rjz-gal__lb-figure{margin:0;width:100%;height:100%;display:grid;place-items:center;padding:72px 84px;box-sizing:border-box;touch-action:pan-y}
.rjz-gal__lb-img{max-width:100%;max-height:calc(100vh - 144px);max-height:calc(100dvh - 144px);object-fit:contain;border-radius:12px;user-select:none;-webkit-user-drag:none;transition:opacity .2s ease}
.rjz-gal__lb-img.is-fading{opacity:0}
.rjz-gal__lb-count{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;opacity:.9}
.rjz-gal__lb-btn{
  all:unset;position:absolute;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.14);color:#fff;cursor:pointer;transition:background .15s ease
}
.rjz-gal__lb-btn:hover{background:rgba(255,255,255,.28)}
.rjz-gal__lb-btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.rjz-gal__lb-close{top:14px;right:14px}
.rjz-gal__lb-prev{left:16px;top:50%;transform:translateY(-50%)}
.rjz-gal__lb-next{right:16px;top:50%;transform:translateY(-50%)}

/* ---------- Responsivo ---------- */
@media (max-width:767px){
  .rjz-gal{--rjz-radius:22px;--rjz-gap:10px}
  .rjz-gal__thumbs{
    display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;padding-bottom:4px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch
  }
  .rjz-gal__thumbs::-webkit-scrollbar{display:none}
  .rjz-gal__thumb{flex:0 0 22%;scroll-snap-align:start}
  .rjz-gal__nav{width:40px;height:40px}
  .rjz-gal__zoom{right:12px;bottom:12px;padding:7px 11px;font-size:13px}
  .rjz-gal{margin:32px auto}
  .rjz-gal__meta{left:12px;bottom:12px}
  .rjz-gal__count{font-size:13px}
  .rjz-gal__lb-figure{padding:64px 8px 96px}
  .rjz-gal__lb-img{max-height:calc(100vh - 160px);max-height:calc(100dvh - 160px)}
  .rjz-gal__lb-prev,.rjz-gal__lb-next{top:auto;bottom:22px;transform:none}
  .rjz-gal__lb-prev{left:calc(50% - 66px)}
  .rjz-gal__lb-next{right:calc(50% - 66px)}
}
@media (prefers-reduced-motion:reduce){
  .rjz-gal *{transition:none!important;animation:none!important}
}
</style>

<script>
(function(){
  document.querySelectorAll('[data-rjz-gal]').forEach(function(root){
    if(root.dataset.rjzReady) return; root.dataset.rjzReady = '1';

    var thumbs  = Array.prototype.slice.call(root.querySelectorAll('.rjz-gal__thumb'));
    var mainImg = root.querySelector('.rjz-gal__main-img');
    var count   = root.querySelector('.rjz-gal__count');
    var lb      = root.querySelector('.rjz-gal__lb');
    var lbImg   = root.querySelector('.rjz-gal__lb-img');
    var lbCount = root.querySelector('.rjz-gal__lb-count');
    var total   = thumbs.length, current = 0;
    var delay   = parseInt(root.dataset.autoplay, 10) || 0;
    var bar     = root.querySelector('.rjz-gal__progress-bar');
    var playBtn = root.querySelector('.rjz-gal__play');
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var timer = null, userPaused = reduced, hovering = false, visible = true;

    // O <dialog> fica preso dentro de containers com overflow/transform do Elementor;
    // movê-lo para o <body> garante que o lightbox cubra a tela inteira.
    document.body.appendChild(lb);

    function photo(i){ var a = thumbs[i]; return { src: a.getAttribute('href'), alt: a.querySelector('img').alt }; }
    function wrap(i){ return (i + total) % total; }
    function preload(i){ var im = new Image(); im.src = photo(wrap(i)).src; }

    function swap(img, p){
      img.classList.add('is-fading');
      var next = new Image();
      next.onload = next.onerror = function(){ img.src = p.src; img.alt = p.alt; img.classList.remove('is-fading'); };
      next.src = p.src;
    }

    function show(i){
      current = wrap(i);
      var p = photo(current);
      swap(mainImg, p);
      if(lb.open) swap(lbImg, p);
      var label = (current + 1) + ' / ' + total;
      count.textContent = label; lbCount.textContent = label;
      thumbs.forEach(function(t, k){ t.setAttribute('aria-current', k === current ? 'true' : 'false'); });
      // mantém a miniatura ativa visível (rolagem horizontal no celular)
      var t = thumbs[current], strip = t.parentNode;
      if(strip.scrollWidth > strip.clientWidth){
        strip.scrollTo({ left: t.offsetLeft - (strip.clientWidth - t.clientWidth) / 2, behavior: 'smooth' });
      }
      preload(current + 1); preload(current - 1);
      restart();
    }

    // ---------- Autoplay ----------
    // Passa sozinho a cada `delay` ms. Pausa com o mouse em cima, com o lightbox aberto,
    // fora da tela ou com a aba oculta; volta sozinho depois. O botão pausar/continuar
    // dá controle total (e começa pausado se o sistema pede "reduzir movimento").
    function canRun(){ return delay && !userPaused && !hovering && visible && !lb.open && !document.hidden; }
    function stopBar(){ bar.style.transition = 'none'; bar.style.transform = 'scaleX(0)'; }
    function restart(){
      clearTimeout(timer); timer = null; stopBar();
      if(!canRun()) return;
      void bar.offsetWidth; // reinicia a animação da barra
      bar.style.transition = 'transform ' + delay + 'ms linear';
      bar.style.transform = 'scaleX(1)';
      timer = setTimeout(function(){ show(current + 1); }, delay);
    }
    function setUserPaused(p){
      userPaused = p;
      root.classList.toggle('is-paused-user', p);
      playBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
      playBtn.setAttribute('aria-label', p ? 'Continuar apresentação' : 'Pausar apresentação');
      restart();
    }
    if(!delay){ playBtn.hidden = true; root.querySelector('.rjz-gal__progress').hidden = true; }
    playBtn.addEventListener('click', function(e){ e.stopPropagation(); setUserPaused(!userPaused); });
    root.addEventListener('mouseenter', function(){ hovering = true; restart(); });
    root.addEventListener('mouseleave', function(){ hovering = false; restart(); });
    root.addEventListener('focusin', function(){ hovering = true; restart(); });
    root.addEventListener('focusout', function(e){ if(!root.contains(e.relatedTarget)){ hovering = false; restart(); } });
    document.addEventListener('visibilitychange', restart);
    if('IntersectionObserver' in window){
      new IntersectionObserver(function(es){ visible = es[0].isIntersecting; restart(); }, { threshold: 0.3 }).observe(root);
    }

    function openLb(){
      var p = photo(current);
      lbImg.src = p.src; lbImg.alt = p.alt;
      lbCount.textContent = (current + 1) + ' / ' + total;
      if(typeof lb.showModal === 'function') lb.showModal(); else lb.setAttribute('open', '');
      document.documentElement.style.overflow = 'hidden';
      restart();
    }
    function closeLb(){ if(lb.open){ lb.close ? lb.close() : lb.removeAttribute('open'); } }
    lb.addEventListener('close', function(){ document.documentElement.style.overflow = ''; restart(); });

    thumbs.forEach(function(t, i){
      t.addEventListener('click', function(e){ e.preventDefault(); show(i); });
    });
    root.querySelector('.rjz-gal__main').addEventListener('click', openLb);
    root.querySelector('.rjz-gal__nav--prev').addEventListener('click', function(){ show(current - 1); });
    root.querySelector('.rjz-gal__nav--next').addEventListener('click', function(){ show(current + 1); });
    lb.querySelector('.rjz-gal__lb-prev').addEventListener('click', function(){ show(current - 1); });
    lb.querySelector('.rjz-gal__lb-next').addEventListener('click', function(){ show(current + 1); });
    lb.querySelector('.rjz-gal__lb-close').addEventListener('click', closeLb);

    // clicar no fundo escuro (fora da foto e dos botões) fecha
    lb.addEventListener('click', function(e){
      if(e.target === lb || e.target.classList.contains('rjz-gal__lb-figure')) closeLb();
    });
    lb.addEventListener('keydown', function(e){
      if(e.key === 'ArrowRight'){ e.preventDefault(); show(current + 1); }
      if(e.key === 'ArrowLeft'){ e.preventDefault(); show(current - 1); }
    });

    // deslizar com o dedo (foto principal e lightbox)
    function swipe(el){
      var x0 = null, y0 = null;
      el.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
      el.addEventListener('touchend', function(e){
        if(x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
        if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ show(current + (dx < 0 ? 1 : -1)); el.dataset.swiped = '1'; setTimeout(function(){ delete el.dataset.swiped; }, 350); }
        x0 = null;
      });
      // evita que um "deslize" na foto principal abra o lightbox
      el.addEventListener('click', function(e){ if(el.dataset.swiped){ e.stopImmediatePropagation(); e.preventDefault(); } }, true);
    }
    swipe(root.querySelector('.rjz-gal__stage'));
    swipe(lb.querySelector('.rjz-gal__lb-figure'));

    setUserPaused(userPaused);
    show(0);
  });
})();
</script>
