<style>
/* Sbelt Laser - Formulário de franquia compacto (GoHighLevel)
   Cole tudo na caixa CUSTOM JAVASCRIPT / HTML do formulário.
   O id repetido (#_builder-form#_builder-form) é proposital: dá mais força
   que os estilos padrão do GHL. */

/* Espaço entre os campos (menor) */
#_builder-form#_builder-form .form-builder--item { margin-bottom: 0 !important; padding-top: 6px !important; padding-bottom: 6px !important; }

/* Rótulos */
#_builder-form#_builder-form label, #_builder-form#_builder-form label * {
  color: #0B2A33 !important;
  font-weight: 700 !important;
  font-size: 13px !important;
  line-height: 1.3 !important;
}
#_builder-form#_builder-form label { margin-bottom: 6px !important; }

/* Campos de texto e lista */
#_builder-form#_builder-form :is(input[type="text"], input[type="tel"], input[type="email"], input[type="number"], input:not([type]), select, textarea),
#_builder-form#_builder-form .multiselect__tags {
  height: 46px !important;
  min-height: 46px !important;
  border: 1.5px solid #E7E1DA !important;
  border-radius: 10px !important;
  background-color: #FFFCF9 !important;
  color: #0B2A33 !important;
  font-size: 14.5px !important;
  font-weight: 500 !important;
  box-shadow: none !important;
  transition: border-color .2s, box-shadow .2s, background-color .2s;
}
#_builder-form#_builder-form :is(input[type="text"], input[type="tel"], input:not([type]), select) { padding-left: 14px !important; }
#_builder-form#_builder-form .multiselect__tags { display: flex !important; align-items: center !important; padding: 0 40px 0 14px !important; }
#_builder-form#_builder-form :is(.multiselect__placeholder, .multiselect__single, .multiselect__input) {
  margin: 0 !important; padding: 0 !important; background: transparent !important;
  font-size: 14.5px !important; line-height: 1.2 !important;
}
#_builder-form#_builder-form .multiselect__single { color: #0B2A33 !important; font-weight: 500 !important; }
#_builder-form#_builder-form .multiselect__select { height: 44px !important; }

/* Campo de busca escondido dentro da lista: não recebe o estilo dos campos */
#_builder-form#_builder-form .multiselect input,
#_builder-form#_builder-form .multiselect input:hover,
#_builder-form#_builder-form .multiselect input:focus {
  height: auto !important;
  min-height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  font-size: 14.5px !important;
}

/* Placeholder */
#_builder-form#_builder-form :is(input, textarea):is([type], :not([type]))::placeholder,
#_builder-form#_builder-form .multiselect__placeholder { color: #9AA6AA !important; font-weight: 400 !important; }

/* Passar o mouse e clicar */
#_builder-form#_builder-form :is(input[type="text"], input[type="tel"], input[type="email"], input[type="number"], input:not([type]), select, textarea):hover, #_builder-form#_builder-form .multiselect:hover .multiselect__tags { border-color: #D6CCC1 !important; }
#_builder-form#_builder-form :is(input[type="text"], input[type="tel"], input[type="email"], input[type="number"], input:not([type]), select, textarea):focus, #_builder-form#_builder-form .multiselect--active .multiselect__tags {
  outline: none !important;
  border-color: #F5841F !important;
  background-color: #FFFFFF !important;
  box-shadow: 0 0 0 4px rgba(245, 132, 31, .14) !important;
}
/* e-mail válido fica com borda verde */
#_builder-form#_builder-form input[type="email"]:not(:placeholder-shown):valid { border-color: #2EAD6B !important; }

/* Lista aberta das opções */
#_builder-form#_builder-form .multiselect__content-wrapper {
  margin-top: 6px !important;
  border: 1.5px solid #F2D9C2 !important;
  border-radius: 10px !important;
  box-shadow: 0 14px 30px -14px rgba(11, 42, 51, .35) !important;
  overflow: hidden !important;
}
#_builder-form#_builder-form .multiselect__option { font-size: 14.5px !important; padding: 12px 14px !important; min-height: 0 !important; color: #0B2A33 !important; }
#_builder-form#_builder-form .multiselect__option--highlight { background: #FFF3E8 !important; color: #0B2A33 !important; }
#_builder-form#_builder-form .multiselect__option--highlight::after { display: none !important; }
#_builder-form#_builder-form .multiselect__option--selected { background: #F5841F !important; color: #FFFFFF !important; font-weight: 700 !important; }

/* Botão */
#_builder-form#_builder-form button {
  height: 50px !important;
  width: 100% !important;
  margin-top: 6px !important;
  border: 0 !important;
  border-radius: 10px !important;
  background: linear-gradient(135deg, #F7941D 0%, #F26A1B 100%) !important;
  color: #FFFFFF !important;
  font-size: 15px !important;
  font-weight: 800 !important;
  box-shadow: 0 10px 22px -12px rgba(242, 106, 27, .8) !important;
  transition: transform .15s, box-shadow .2s, filter .2s;
}
#_builder-form#_builder-form button * { color: #FFFFFF !important; font-weight: 800 !important; }
#_builder-form#_builder-form button:hover {
  transform: translateY(-2px);
  filter: brightness(1.04);
  box-shadow: 0 14px 26px -12px rgba(242, 106, 27, .9) !important;
}
</style>

<script>
(function () {
  // Máscara BR: (99) 99999-9999 para celular e (99) 9999-9999 para fixo
  function mask(v) {
    var d = v.replace(/\D/g, '');
    if (d.length > 11 && d.indexOf('55') === 0) d = d.slice(2); // remove +55 colado
    d = d.slice(0, 11);
    if (!d) return '';
    if (d.length <= 2) return '(' + d;
    if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
    if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
    return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
  }

  // O GHL nem sempre usa type="tel"; reconhece o telefone também pelo nome ou pelo placeholder
  function isPhone(el) {
    if (!el || el.tagName !== 'INPUT') return false;
    return el.type === 'tel' ||
      /phone|telefone|whats/i.test(el.name || '') ||
      /tel/i.test(el.getAttribute('autocomplete') || '') ||
      /0000/.test(el.getAttribute('placeholder') || '');
  }

  // Captura antes do GHL ler o valor, então o valor salvo já sai com a máscara
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (!isPhone(el)) return;
    var m = mask(el.value);
    if (el.value !== m) el.value = m;
  }, true);

  // O formulário é montado depois do carregamento, então observa até o campo aparecer
  function setup() {
    document.querySelectorAll('input').forEach(function (el) {
      if (!isPhone(el) || el.dataset.sbMask) return;
      el.dataset.sbMask = '1';
      el.setAttribute('placeholder', '(00) 00000-0000');
      el.setAttribute('inputmode', 'numeric');
    });
  }
  setup();
  new MutationObserver(setup).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
